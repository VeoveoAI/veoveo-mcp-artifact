[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/VeoveoAI/veoveo-mcp-artifact"
publish = false

[workspace.dependencies]
# veoveo-core, pinned to one revision for every core crate.
veoveo-platform-store = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "c0c8254f4a1f532a7c8bb5123639d9997700b105" }
veoveo-test-fixtures = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "c0c8254f4a1f532a7c8bb5123639d9997700b105" }
veoveo-types = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "c0c8254f4a1f532a7c8bb5123639d9997700b105" }
veoveo-audit = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "c0c8254f4a1f532a7c8bb5123639d9997700b105" }
veoveo-audit-contract = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "c0c8254f4a1f532a7c8bb5123639d9997700b105" }
veoveo-task-runtime = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "c0c8254f4a1f532a7c8bb5123639d9997700b105" }
# RFC 7523 client assertions for the acceptance callers.
veoveo-oauth-client = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "c0c8254f4a1f532a7c8bb5123639d9997700b105" }
# The Rust SDK for Veoveo MCP servers: the contract feature for the permission and audit
# declarations, the server feature for hosting, registration and forwarded identity.
veoveo-sdk-rust = { git = "https://github.com/VeoveoAI/veoveo-sdk-rust", rev = "3ea1a32d9a818ca79a816e191dba1346a92cdf26", default-features = false }
# Ledger, the SDK's calls fixture server: the consumer the client tests call Artifact for.
veoveo-sdk-rust-fixture = { git = "https://github.com/VeoveoAI/veoveo-sdk-rust", rev = "3ea1a32d9a818ca79a816e191dba1346a92cdf26" }

anyhow = "=1.0.104"
# The share route, served beside MCP on the SDK's router.
axum = { version = "0.8.9", default-features = false }
# Object storage through the AWS SDK for Rust, without aws-config: credentials come from
# the server's configuration, and the HTTP client is hyper 1 on rustls with ring.
aws-sdk-s3 = { version = "=1.152.0", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-smithy-http-client = { version = "=1.5.0", default-features = false, features = ["rustls-ring"] }
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
futures = "0.3.34"
# The operating system's random source for share-link secrets.
getrandom = "0.4.3"
hex = "=0.4.3"
# The SDK's HTTP client release; the registration client and the tests share it.
reqwest = { version = "=0.13.5", default-features = false }
# The rmcp fork the SDK pins; Artifact's tool router uses its macros.
rmcp = { version = "=3.5.0", git = "https://github.com/VeoveoAI/rust-sdk", rev = "917e7914c93975fc1eddbff8792f1e2de933bc17" }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
# The release the SDK pins exactly.
sha2 = "=0.11.0"
secrecy = "0.10.3"
tokio-util = "0.7.20"
# The share route's tests send requests to the router in process.
tower = { version = "0.5.3", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false }
url = "=2.5.8"

# Date and time without a clock in the contract; the server enables `clock`. The exact
# release matches veoveo-types.
chrono = { version = "=0.4.45", default-features = false, features = ["serde", "std"] }
schemars = { version = "1.2.2", features = ["chrono04", "uuid1"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# PostgreSQL 18 through the same sqlx release and features as veoveo-core. `sqlx-toml`
# reads the crate's migration table from its `sqlx.toml`.
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "uuid", "chrono", "json", "migrate", "macros", "sqlx-toml"] }
thiserror = "=2.0.21"
tokio = "1.53.1"
# The exact release veoveo-types pins; Artifact generates UUIDv7 identifiers.
uuid = { version = "=1.25.0", default-features = false, features = ["serde", "std", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
