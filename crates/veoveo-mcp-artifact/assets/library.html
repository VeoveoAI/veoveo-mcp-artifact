<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Artifacts</title>
<style>
:root {
  --bg: var(--color-background-primary, #ffffff);
  --bg-soft: var(--color-background-secondary, #f4f5f7);
  --fg: var(--color-text-primary, #16181d);
  --fg-soft: var(--color-text-secondary, #5b616e);
  --line: var(--color-border-primary, #dfe2e7);
  --accent: var(--color-text-info, #2557d6);
  --danger: var(--color-text-danger, #b42318);
  --radius: var(--border-radius-md, 8px);
  --sans: var(--font-sans, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: var(--color-background-primary, #14161a);
  --bg-soft: var(--color-background-secondary, #1d2026);
  --fg: var(--color-text-primary, #e8eaee);
  --fg-soft: var(--color-text-secondary, #9aa1ad);
  --line: var(--color-border-primary, #2c3038);
  --accent: var(--color-text-info, #7aa2ff);
  --danger: var(--color-text-danger, #ff8a80);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans); }
main { padding: 12px; display: grid; gap: 12px; }
header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 16px; font-weight: 600; margin-right: auto; }
input, button { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 5px 9px; }
input { min-width: 200px; }
button { cursor: pointer; }
button:hover { background: var(--bg-soft); }
ul { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
li + li { border-top: 1px solid var(--line); }
li button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; width: 100%; text-align: left; border: 0; border-radius: 0; padding: 8px 12px; }
.name { color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.size, .facts { color: var(--fg-soft); font-size: 12px; }
.size { text-align: right; }
.facts { grid-column: 1 / -1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty, .error { padding: 16px; text-align: center; color: var(--fg-soft); }
.error { color: var(--danger); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Artifacts</h1>
    <input id="name" type="search" placeholder="Name starts with" aria-label="Name starts with">
    <button id="refresh" type="button">Refresh</button>
  </header>
  <div id="problem" class="error" hidden></div>
  <ul id="artifacts" hidden></ul>
  <div id="empty" class="empty" hidden>No artifacts here.</div>
  <button id="more" type="button" hidden>More</button>
</main>
<script>
"use strict";
// Artifact's library: a page of the artifacts the person may read, from its own server, each
// opening through the Hub's /view/ page, which frames it on the content domain.
(() => {
  const PROTOCOL = "2026-01-26";
  const TIMEOUT = 30000;
  const $ = (id) => document.getElementById(id);
  const pending = new Map();
  let nextId = 1;
  let cursor = null;

  const post = (message) => window.parent.postMessage(message, "*");
  const notify = (method, params) => post({ jsonrpc: "2.0", method, params });
  const request = (method, params) => new Promise((resolve, reject) => {
    const id = nextId++;
    const timer = setTimeout(() => {
      pending.delete(id);
      reject(new Error(`the host did not answer ${method}`));
    }, TIMEOUT);
    pending.set(id, { resolve, reject, timer });
    post({ jsonrpc: "2.0", id, method, params });
  });

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const message = event.data;
    if (!message || typeof message !== "object" || message.jsonrpc !== "2.0") return;
    if (typeof message.method === "string") {
      if (message.method === "ui/notifications/host-context-changed") applyContext(message.params);
      if (message.id !== undefined && message.id !== null) {
        post({ jsonrpc: "2.0", id: message.id, result: {} });
      }
      return;
    }
    const call = pending.get(message.id);
    if (!call) return;
    pending.delete(message.id);
    clearTimeout(call.timer);
    if (message.error) call.reject(new Error(message.error.message || "the request failed"));
    else call.resolve(message.result);
  });

  const applyContext = (context) => {
    if (context && (context.theme === "dark" || context.theme === "light")) {
      document.documentElement.dataset.theme = context.theme;
    }
  };

  const size = (bytes) => {
    if (typeof bytes !== "number") return "";
    const units = ["B", "KB", "MB", "GB", "TB"];
    let value = bytes;
    let unit = 0;
    while (value >= 1024 && unit < units.length - 1) {
      value /= 1024;
      unit += 1;
    }
    return `${unit === 0 ? value : value.toFixed(1)} ${units[unit]}`;
  };

  const facts = (artifact, level) => {
    const parts = [artifact.mediaType, level];
    if (artifact.availableAt) parts.push(new Date(artifact.availableAt).toLocaleString());
    if (artifact.releaseState === "released") parts.push("released");
    const from = artifact.provenance && artifact.provenance.actingServer;
    if (from) parts.push(`from ${from}`);
    return parts.join(" · ");
  };

  const open = async (artifact) => {
    try {
      await request("ui/open-link", {
        url: `/view/artifact/${artifact.artifactId}/${encodeURIComponent(artifact.name)}`,
      });
    } catch (error) {
      showProblem(`This artifact could not be opened: ${error.message}`);
    }
  };

  const row = (artifact, level) => {
    const item = document.createElement("li");
    const button = document.createElement("button");
    button.type = "button";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = artifact.name;
    const bytes = document.createElement("span");
    bytes.className = "size";
    bytes.textContent = size(artifact.size);
    const about = document.createElement("span");
    about.className = "facts";
    about.textContent = facts(artifact, level);
    button.append(name, bytes, about);
    button.addEventListener("click", () => open(artifact));
    item.append(button);
    return item;
  };

  const showProblem = (text) => {
    $("problem").textContent = text;
    $("problem").hidden = false;
  };

  const address = () => {
    const query = new URLSearchParams();
    const name = $("name").value.trim();
    if (name) query.set("name", name);
    if (cursor) query.set("cursor", cursor);
    const text = query.toString().replaceAll("+", "%20");
    return text ? `artifact://artifacts?${text}` : "artifact://artifacts";
  };

  const load = async (fresh) => {
    if (fresh) cursor = null;
    $("problem").hidden = true;
    try {
      const read = await request("resources/read", { uri: address() });
      const page = JSON.parse(read.contents[0].text);
      const list = $("artifacts");
      if (fresh) list.replaceChildren();
      for (const { artifact, level } of page.items) list.append(row(artifact, level));
      list.hidden = list.children.length === 0;
      $("empty").hidden = list.children.length !== 0;
      cursor = page.nextCursor || null;
      $("more").hidden = !cursor;
    } catch (error) {
      showProblem(`The artifacts could not be read: ${error.message}`);
    }
  };

  const start = async () => {
    let timer;
    $("refresh").addEventListener("click", () => load(true));
    $("more").addEventListener("click", () => load(false));
    $("name").addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(() => load(true), 250);
    });
    try {
      const initialized = await request("ui/initialize", {
        protocolVersion: PROTOCOL,
        appInfo: { name: "Artifacts", version: "1" },
        appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
      });
      applyContext(initialized && initialized.hostContext);
    } catch (error) {
      showProblem(`The library could not connect to its host: ${error.message}`);
      return;
    }
    notify("ui/notifications/initialized", {});
    new ResizeObserver(() => {
      notify("ui/notifications/size-changed", { height: document.documentElement.scrollHeight });
    }).observe(document.body);
    await load(true);
  };

  start();
})();
</script>
</body>
</html>
