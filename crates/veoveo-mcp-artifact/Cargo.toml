[package]
name = "veoveo-mcp-artifact"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["server"]
# Artifact's public types: identifiers, resource addresses, metadata, grants, uploads,
# tool requests and results, the permission vocabulary and the audit details. No
# database, runtime or object-storage dependency.
contract = [
    "dep:chrono",
    "dep:schemars",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:uuid",
    "dep:veoveo-audit-contract",
    "dep:veoveo-sdk-rust",
    "dep:veoveo-types",
]
# The hosted server: MCP through the SDK, persistence in the `artifact` schema, object
# storage, the verification Tasks, the sweep and the binary.
server = [
    "contract",
    "chrono/clock",
    "veoveo-sdk-rust/server",
    "dep:anyhow",
    "dep:aws-sdk-s3",
    "dep:aws-smithy-http-client",
    "dep:base64",
    "dep:bytes",
    "dep:clap",
    "dep:dotenvy",
    "dep:futures",
    "dep:hex",
    "dep:reqwest",
    "dep:rmcp",
    "dep:rustls",
    "dep:secrecy",
    "dep:sha2",
    "dep:sqlx",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tracing",
    "dep:url",
    "dep:veoveo-audit",
    "veoveo-audit-contract/postgres",
    "dep:veoveo-platform-store",
    "dep:veoveo-task-runtime",
]

[dependencies]
chrono = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
veoveo-audit-contract = { workspace = true, optional = true }
veoveo-sdk-rust = { workspace = true, features = ["contract"], optional = true }
veoveo-types = { workspace = true, optional = true }

anyhow = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
aws-smithy-http-client = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["rustls-no-provider"], optional = true }
rmcp = { workspace = true, features = ["server", "macros", "schemars", "transport-streamable-http-server"], optional = true }
rustls = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }
veoveo-audit = { workspace = true, optional = true }
veoveo-platform-store = { workspace = true, optional = true }
veoveo-task-runtime = { workspace = true, optional = true }

[dev-dependencies]
veoveo-platform-store.workspace = true
veoveo-sdk-rust = { workspace = true, features = ["server", "testing"] }
# `database-conformance` holds the crate's queries and schema to core's database rules.
veoveo-test-fixtures = { workspace = true, features = ["store", "database-conformance"] }
reqwest = { workspace = true, features = ["rustls-no-provider"] }
tokio = { workspace = true, features = ["full"] }

[[bin]]
name = "veoveo-mcp-artifact"
required-features = ["server"]

[[test]]
name = "database_conformance"
required-features = ["server"]
