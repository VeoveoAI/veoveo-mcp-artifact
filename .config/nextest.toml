[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }
# Tests start a private SeaweedFS on ports that are free only when chosen. Under a busy build
# host, another process can take one after SeaweedFS first answers, and the bucket's preparation
# then fails. A second try gets other ports, and nextest reports the test as flaky.
retries = 1

[profile.ci.junit]
path = "junit.xml"

# Artifact's acceptance tests share one tenant's usage and upload limits in a running
# installation, so they run one at a time and allow for a gibibyte transfer.
[test-groups]
acceptance = { max-threads = 1 }

[[profile.default.overrides]]
filter = "binary(acceptance)"
test-group = "acceptance"
slow-timeout = { period = "120s", terminate-after = 8 }
